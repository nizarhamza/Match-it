<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Match It</title>
<meta name="description" content="Everyone thinks of a word. Say it out loud, at the same time, round after round, until the whole room lands on the same one." />
<meta name="theme-color" content="#14131A" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --ink: #17151F;
    --ink-soft: #201D2C;
    --paper: #F6F3ED;
    --paper-soft: #FFFFFF;
    --signal: #6B5CE7;      /* searching / in progress */
    --signal-soft: #6B5CE71a;
    --match: #2FBF8F;       /* reserved for the matched moment */
    --match-soft: #2FBF8F1f;
    --match-ink: #52D6A9;
    /* Near-miss clusters within a round: one hue each. */
    --g1: #6B5CE7; --g1-soft: #7B6CF02e; --g1-line: #8B7DF599;
    --g2: #95600A; --g2-soft: #E8A33D26; --g2-line: #E8A33D99;
    --g3: #1F7FB0; --g3-soft: #3AA7E026; --g3-line: #3AA7E099;
    --text: #E9E6F2;
    --text-muted: #A6A0BE;
    --line: #ffffff1a;
    --danger: #E5636B;
    --radius: 18px;
    --radius-sm: 10px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #F6F3ED;
      --ink-soft: #FFFFFF;
      --text: #241F33;
      --text-muted: #6B6480;
      --line: #17151F14;
      --signal-soft: #6B5CE714;
      --match-soft: #2FBF8F1a;
      --match-ink: #17795A;
      --g1-soft: #6B5CE71c; --g1-line: #6B5CE780;
      --g2-soft: #E8A33D26; --g2-line: #C9861A99;
      --g3-soft: #3AA7E01f; --g3-line: #2A93C999;
    }
  }
  :root[data-theme="light"] {
    --ink: #F6F3ED;
    --ink-soft: #FFFFFF;
    --text: #241F33;
    --text-muted: #6B6480;
    --line: #17151F14;
    --signal-soft: #6B5CE714;
    --match-soft: #2FBF8F1a;
    --match-ink: #17795A;
    --g1-soft: #6B5CE71c; --g1-line: #6B5CE780;
    --g2-soft: #E8A33D26; --g2-line: #C9861A99;
    --g3-soft: #3AA7E01f; --g3-line: #2A93C999;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: var(--safe-top); }

  #app {
    min-height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; }
  button {
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
  input {
    font-family: inherit;
    font-size: 1rem;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.85em 1.3em;
    font-weight: 600;
    background: var(--ink-soft);
    color: var(--text);
    border: 1px solid var(--line);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--signal);
    color: white;
    border-color: transparent;
  }
  .btn-primary:disabled {
    background: var(--ink-soft);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--text-muted);
  }
  .btn-danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .btn-block { width: 100%; display: block; }

  input[type="text"] {
    width: 100%;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.85em 1em;
    color: var(--text);
  }
  input[type="text"]:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
  input[type="text"]::placeholder { color: var(--text-muted); }

  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 22px calc(28px + var(--safe-bottom));
  }

  /* ---------- Menu ---------- */
  .wordmark {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 2.6rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .wordmark .dot { color: var(--signal); }
  .tagline {
    color: var(--text-muted);
    margin: 0 0 40px;
    max-width: 32ch;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .menu-actions { margin-top: auto; padding-top: 40px; display: flex; flex-direction: column; gap: 12px; }

  details.how {
    margin-top: 24px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  details.how summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
  }
  details.how summary::-webkit-details-marker { display: none; }
  details.how summary::after {
    content: "+";
    float: right;
    color: var(--text-muted);
  }
  details.how[open] summary::after { content: "–"; }
  details.how p { color: var(--text-muted); margin: 12px 0 0; }

  /* ---------- Nickname / join form ---------- */
  .field-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: block;
  }
  .back-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 6px;
    font-size: 1.1rem;
  }
  .screen-title {
    font-family: var(--font-display);
    font-size: 1.6rem;
    margin: 0 0 24px;
  }

  /* ---------- Lobby ---------- */
  .room-code {
    font-family: var(--font-display);
    font-size: 2.6rem;
    letter-spacing: 0.06em;
    font-weight: 600;
    background: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    margin: 0 0 6px;
  }
  .room-code-hint {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 28px;
  }
  .section-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .player-list { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 8px; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
  }
  .dot-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .dot-status.on { background: var(--match); }
  .player-name { font-weight: 600; flex: 1; }
  .player-tag {
    font-size: 0.75rem;
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .player-tag.host { color: var(--signal); border-color: var(--signal-soft); background: var(--signal-soft); }

  .role-toggle {
    display: flex;
    gap: 8px;
    margin: 18px 0 30px;
  }
  .role-toggle button {
    flex: 1;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .role-toggle button.active {
    color: var(--signal);
    border-color: var(--signal-soft);
    background: var(--signal-soft);
  }

  .share-row { margin: 0 0 24px; }
  .recap { margin-top: 14px; overflow-x: auto; }
  .kick-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 4px 6px;
    font-size: 0.9rem;
    border-radius: 6px;
  }
  .kick-btn:hover { color: var(--danger); }

  .lobby-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .hint-text { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin: 0; }

  /* ---------- Playing (thread) ---------- */
  .play-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  /* Keep the header clear of the fixed theme button on narrow screens. */
  @media (max-width: 640px) {
    .play-header { padding-right: 48px; }
  }
  .round-pill {
    font-size: 0.8rem;
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .progress { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
  .progress i {
    width: 7px; height: 7px; border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px var(--text-muted);
    transition: background 200ms cubic-bezier(.22,1,.36,1), box-shadow 200ms;
  }
  .progress i.on { background: var(--match); box-shadow: none; }

  .thread {
    flex: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
    padding-bottom: 12px;
    overscroll-behavior: contain;
  }
  /* More players than fit: fade the edge that has columns hidden past it. */
  .thread.more-right { -webkit-mask-image: linear-gradient(to left, transparent, #000 36px); mask-image: linear-gradient(to left, transparent, #000 36px); }
  .thread-hint {
    margin: auto 0 20px;
    padding-top: 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    text-wrap: balance;
  }

  /* ---------- Board: one column per player, one row per round ---------- */
  .board {
    --rn: 1.4rem;
    --min-col: 4.25rem;
    margin-top: auto; /* few rounds: sit down by the compose bar */
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: min-content;
    padding-right: 6px; /* room for the last column's count badge */
  }
  .thread-hint + .board { margin-top: 0; }
  .board-row {
    display: grid;
    grid-template-columns: var(--rn) repeat(var(--cols), minmax(var(--min-col), 1fr));
    gap: 6px;
  }
  .board-head {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--ink);
    padding: 2px 0 6px;
    align-items: end;
  }
  .board .rn {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--ink);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    /* Cover the gaps beside and between rows as columns scroll under, so
       tile edges and count badges don't peek out around the numbers. */
    box-shadow:
      6px 0 0 var(--ink),
      0 -8px 0 var(--ink), 6px -8px 0 var(--ink),
      0 8px 0 var(--ink), 6px 8px 0 var(--ink);
  }
  .board .rn { align-self: stretch; display: flex; align-items: center; }
  .board-head .rn { z-index: 2; }
  .board-head .name {
    min-width: 0;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .board-head .name.me { color: var(--signal); }
  .board-head .name.gone { font-weight: 400; opacity: 0.6; }

  .tile {
    position: relative;
    min-width: 0;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 5px;
    border-radius: 12px;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    font-family: var(--font-display);
    font-size: 1.05rem;
    line-height: 1.2;
    text-align: center;
    hyphens: auto;
    overflow-wrap: anywhere;
  }
  /* Long words step down in size before they ever break mid-word. */
  .board.measuring .tile { white-space: nowrap; overflow: hidden; }
  .board.measuring .count, .board.measuring .tile::after { display: none; }
  .tile.sm, .tile.status.sent.sm { font-size: 0.9rem; }
  .tile.xs, .tile.status.sent.xs { font-size: 0.78rem; }
  .tile.none { background: transparent; border-style: dashed; color: var(--text-muted); font-family: var(--font-body); }
  .tile[data-g="1"] { --g: var(--g1); --g-soft: var(--g1-soft); --g-line: var(--g1-line); }
  .tile[data-g="2"] { --g: var(--g2); --g-soft: var(--g2-soft); --g-line: var(--g2-line); }
  .tile[data-g="3"] { --g: var(--g3); --g-soft: var(--g3-soft); --g-line: var(--g3-line); }
  .tile[data-g] { background: var(--g-soft); border-color: var(--g-line); }
  .tile .count {
    position: absolute;
    top: -7px;
    right: -5px;
    font-family: var(--font-body);
    font-size: 0.66rem;
    font-weight: 700;
    line-height: 1;
    color: #fff;
    background: var(--g);
    border-radius: 999px;
    padding: 3px 6px;
  }
  .board-row.matched .tile { background: var(--match-soft); border-color: var(--match); }

  /* The round being written: status instead of words. */
  .board-row.current { padding-top: 10px; border-top: 1px dashed var(--line); }
  .tile.status { font-family: var(--font-body); font-size: 0.85rem; color: var(--text-muted); background: transparent; border-style: dashed; }
  .tile.status.in { border-style: solid; border-color: var(--match); color: var(--match-ink); background: var(--match-soft); font-weight: 600; }
  .tile.status.sent { border-style: solid; font-family: var(--font-display); font-size: 1.05rem; color: var(--text); background: var(--ink-soft); }
  .tile.status.sent::after {
    content: "✓";
    position: absolute; top: -7px; right: -5px;
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--font-body); font-size: 0.65rem; font-weight: 700;
    color: #0B3326; background: var(--match);
  }
  .tile.status.away { opacity: 0.55; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.5; }

  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation: blink 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    .board-row.fresh .tile { animation: pop 380ms cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i) * 70ms); }
    .reveal-note.fresh { animation: rise 0.3s cubic-bezier(.22,1,.36,1); }
  }
  @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.92); }
    to { opacity: 1; transform: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* The play screen is a fixed-height column so the thread scrolls and the
     compose bar stays pinned, instead of the whole page growing. */
  .play-screen {
    flex: none; /* .screen's flex:1 would otherwise override the height */
    height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
    padding-bottom: 14px;
  }
  .play-screen .thread { min-height: 0; }

  .compose {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--ink) 60%, transparent);
    padding-top: 18px;
    padding-bottom: calc(6px + var(--safe-bottom));
  }
  .compose-row { display: flex; gap: 10px; }
  .compose-row input { flex: 1; }
  .compose-status {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 10px 0 0;
    text-align: center;
  }
  .compose-locked {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--ink-soft);
  }
  .end-game-row { text-align: center; margin-top: 14px; }
  .end-game-row button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- Matched ---------- */
  .matched-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 22px calc(28px + var(--safe-bottom));
  }
  .matched-label {
    color: var(--match);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 14px;
  }
  .matched-word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 3rem;
    line-height: 1.1;
    margin: 0 0 10px;
    word-break: break-word;
  }
  .matched-sub { color: var(--text-muted); margin: 0 0 28px; }
  /* How the room got there: the same board as the game, scrollable. */
  .path {
    width: 100%;
    margin: 0 0 32px;
    text-align: left;
    max-height: 36vh;
    overflow: auto;
    padding-top: 2px;
  }
  .matched-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }

  .pulse-ring {
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 2px solid var(--match);
    margin-bottom: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .pulse-ring::before {
    content: "";
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--match-soft);
  }
  @media (prefers-reduced-motion: no-preference) {
    .pulse-ring { animation: pulse 1.8s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--match-soft); }
    50% { box-shadow: 0 0 0 14px transparent; }
  }

  /* ---------- Banners / toasts ---------- */
  .banner {
    margin: 0 22px 0;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    border: 1px solid var(--line);
  }
  .banner.error { border-color: var(--danger); color: var(--danger); }
  .banner.info { border-color: var(--signal-soft); background: var(--signal-soft); color: var(--text); }

  .theme-switch {
    position: fixed;
    top: calc(16px + var(--safe-top));
    right: 16px;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 999px;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<button class="theme-switch" id="themeSwitch" aria-label="Toggle light and dark theme">◑</button>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------
  // By default the client talks to the Worker on the same origin ("/api/...",
  // same-origin WebSocket). If you deployed the Worker to its own workers.dev
  // subdomain instead of routing it under this Pages domain, pass it once via
  // ?api=https://match-it.<you>.workers.dev — it's then remembered in
  // localStorage. See DEPLOY.md.
  const params = new URLSearchParams(location.search);
  if (params.get("api")) localStorage.setItem("matchit_api_base", params.get("api"));
  const API_BASE = (localStorage.getItem("matchit_api_base") || "").replace(/\/$/, "");

  const WS_BASE = API_BASE
    ? API_BASE.replace(/^http/, "ws")
    : (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

  // ---------------------------------------------------------------------
  // Tiny state store + view
  // ---------------------------------------------------------------------
  const root = document.getElementById("app");
  let view = "menu"; // menu | nickname | lobby | playing | matched
  let pendingAction = null; // "create" | "join" — which the nickname screen is for
  let joinCodeDraft = "";

  let nickname = localStorage.getItem("matchit_nickname") || "";
  let playerId = localStorage.getItem("matchit_pid") || "";
  let roomCode = "";
  let ws = null;
  let wsReady = false;
  let connError = "";
  let reconnectAttempts = 0;
  let reconnectTimer = null;

  const FATAL_CLOSE = {
    4403: "The host removed you from the room.",
    4404: "That room doesn't exist (or has expired).",
    4409: "That room is full.",
  };
  const FATAL_ERRORS = new Set(["kicked", "room_not_found", "room_full"]);

  const EMPTY_ROOM = { status: "lobby", round: 0, hostId: null, players: [], submittedIds: [], submittedCount: 0, activeCount: 0, history: [] };
  let room = EMPTY_ROOM;
  let lastReveal = null; // most recent {round, words, groups, matched, nicknames}

  // The word you're typing survives re-renders — every other player's submit
  // triggers one, and wiping a half-typed word mid-thought is maddening.
  let wordDraft = "";
  // Round we just sent a word for, until the server's state confirms it —
  // keeps the compose bar locked through the round trip.
  let pendingSubmitRound = 0;
  // What you sent this round, shown back in your own column until reveal.
  let sentWord = { round: 0, word: "" };

  function me() {
    return room.players.find((p) => p.id === playerId) || null;
  }
  function isHost() {
    return room.hostId === playerId;
  }
  function hasSubmittedThisRound() {
    return (room.submittedIds || []).includes(playerId) || pendingSubmitRound === room.round;
  }

  // ---------------------------------------------------------------------
  // Networking
  // ---------------------------------------------------------------------
  async function createRoom() {
    const res = await fetch(API_BASE + "/api/rooms", { method: "POST" });
    if (!res.ok) throw new Error("Could not create a room right now.");
    const data = await res.json();
    return data.code;
  }

  function connect(code) {
    // A leftover socket from a previous room (e.g. the boot-time auto-reconnect
    // racing a fresh "create room") must not keep steering this connection —
    // close it and ignore anything it still has in flight.
    const old = ws;
    ws = null;
    if (old) { try { old.close(); } catch {} }
    clearTimeout(reconnectTimer);

    if (code !== roomCode) { room = EMPTY_ROOM; lastReveal = null; wordDraft = ""; revealNote = ""; }
    roomCode = code;
    wsReady = false;
    connError = "";
    const qs = new URLSearchParams({ nickname: nickname || "Player" });
    if (playerId) qs.set("pid", playerId);
    const url = WS_BASE + "/api/rooms/" + code + "/socket?" + qs.toString();

    const socket = new WebSocket(url);
    ws = socket;
    socket.addEventListener("open", () => {
      if (socket !== ws) return;
      wsReady = true; render();
    });
    // Heartbeat: the room drops sockets it hasn't heard from in 90s, which is
    // how it notices a phone that went dark without closing its connection.
    const heartbeat = setInterval(() => {
      if (socket !== ws || socket.readyState > 1) { clearInterval(heartbeat); return; }
      if (socket.readyState === 1) socket.send(JSON.stringify({ type: "ping", t: Date.now() }));
    }, 20000);
    socket.addEventListener("close", (ev) => {
      if (socket !== ws) return; // superseded by a newer connect() — not our concern
      wsReady = false;
      // The server closes with one of these when retrying can't help (bad
      // code, full room, kicked) — drop back to the menu instead of looping.
      if (FATAL_CLOSE[ev.code]) {
        exitRoom(FATAL_CLOSE[ev.code], ev.code !== 4403);
        return;
      }
      if (view !== "menu" && roomCode) {
        reconnectAttempts++;
        connError = "Connection lost. Reconnecting…";
        render();
        const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 10000);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => { if (roomCode) connect(roomCode); }, delay);
      }
    });
    socket.addEventListener("error", () => {});
    socket.addEventListener("message", (ev) => {
      if (socket !== ws) return;
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      handleMessage(data);
    });
  }

  function send(payload) {
    if (ws && wsReady) ws.send(JSON.stringify(payload));
  }

  function handleMessage(data) {
    switch (data.type) {
      case "welcome":
        playerId = data.playerId;
        reconnectAttempts = 0;
        connError = "";
        localStorage.setItem("matchit_pid", playerId);
        localStorage.setItem("matchit_room", data.code);
        view = view === "playing" || view === "matched" ? view : "lobby";
        render();
        break;

      case "state":
        room = data;
        if (room.status !== "playing" || room.round !== pendingSubmitRound) pendingSubmitRound = 0;
        if (room.status === "lobby") freshRound = 0;
        if (room.status === "playing") view = "playing";
        if (room.status === "matched") view = "matched";
        if (room.status === "lobby" && (view === "playing" || view === "matched")) view = "lobby";
        render();
        break;

      case "reveal":
        lastReveal = data;
        freshRound = data.round;
        if (!data.matched) flashReveal(data);
        render();
        break;

      case "error":
        // Fatal ones arrive just before the server closes the socket. Act on
        // the message itself: the close handshake can linger in CLOSING.
        if (FATAL_ERRORS.has(data.code)) { exitRoom(data.message, data.code !== "kicked"); break; }
        showBanner(data.message || "Something went wrong.");
        break;
    }
  }

  // Short-lived banner that doesn't clobber a newer one when its timer fires.
  let bannerTimer = null;
  let bannerKind = "error";
  function showBanner(message, ms = 3500, kind = "error") {
    connError = message;
    bannerKind = kind;
    render();
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      if (connError === message) { connError = ""; bannerKind = "error"; render(); }
    }, ms);
  }

  // A missed round is the most common moment in the game, so it gets a
  // one-line summary of how close the room got instead of a silent re-render.
  let revealNote = "";
  let freshRound = 0; // animate this round's block once, on the render that first shows it
  let revealTimer = null;
  function flashReveal(entry) {
    const top = entry.groups && entry.groups[0];
    const n = Object.keys(entry.words).length;
    if (top && top.length > 1) {
      revealNote = `No match yet. ${top.length} of ${n} said “${entry.words[top[0]]}”.`;
    } else {
      revealNote = "No match yet. Everyone said something different.";
    }
    clearTimeout(revealTimer);
    revealTimer = setTimeout(() => { revealNote = ""; render(); }, 6000);
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  async function onCreateRoom() {
    try {
      const code = await createRoom();
      connect(code);
      view = "lobby";
      render();
    } catch (e) {
      connError = e.message;
      render();
    }
  }

  function onJoinRoom(code) {
    connect(code);
    view = "lobby";
    render();
  }

  function onSetRole(role) {
    send({ type: "role", role });
  }
  function onStart() { send({ type: "start" }); }
  function onEnd() { send({ type: "end" }); }
  function onRematch() { send({ type: "rematch" }); }
  function onKick(id) {
    const p = room.players.find((pp) => pp.id === id);
    if (p && confirm(`Remove ${p.nickname} from the room?`)) send({ type: "kick", playerId: id });
  }
  function onLeave() {
    send({ type: "leave" });
    exitRoom("");
  }
  // Back to the menu and forget the room, whether we left or were turned away.
  // A failed join goes back to the join form instead, code still filled in.
  function exitRoom(message, backToJoin = false) {
    const failedCode = roomCode;
    const old = ws;
    ws = null;
    wsReady = false;
    if (old) { try { old.close(); } catch {} }
    clearTimeout(reconnectTimer);
    reconnectAttempts = 0;
    roomCode = "";
    localStorage.removeItem("matchit_room");
    view = backToJoin ? "nickname" : "menu";
    if (backToJoin) { pendingAction = "join"; joinCodeDraft = failedCode; }
    room = EMPTY_ROOM;
    lastReveal = null;
    wordDraft = "";
    revealNote = "";
    connError = message;
    render();
  }
  function onSubmit(word) {
    word = word.trim();
    if (!word || !wsReady) return;
    pendingSubmitRound = room.round;
    sentWord = { round: room.round, word };
    wordDraft = "";
    send({ type: "submit", word });
    render();
  }

  // ---------------------------------------------------------------------
  // Rendering — small hand-rolled templating, no framework
  // ---------------------------------------------------------------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    // Full innerHTML swaps drop focus; put it back where it was so a state
    // broadcast mid-typing doesn't yank the keyboard away on mobile.
    const active = document.activeElement;
    const focusId = active && root.contains(active) ? active.id : "";
    const caret = focusId && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;

    if (view === "menu") renderMenu();
    else if (view === "nickname") renderNickname();
    else if (view === "lobby") renderLobby();
    else if (view === "playing") renderPlaying();
    else if (view === "matched") renderMatched();

    const again = focusId && document.getElementById(focusId);
    if (again) {
      again.focus();
      if (caret && again.setSelectionRange) { try { again.setSelectionRange(caret[0], caret[1]); } catch {} }
    }
  }

  function renderMenu() {
    root.innerHTML = `
      <div class="screen">
        <h1 class="wordmark">Match It<span class="dot">.</span></h1>
        <p class="tagline">Everyone writes a word, round after round, until the whole room lands on the same one.</p>
        ${connError ? `<div class="banner error" role="alert">${esc(connError)}</div>` : ""}
        <div class="menu-actions">
          <button class="btn btn-primary btn-block" id="btnCreate">Create a room</button>
          <button class="btn btn-block" id="btnJoin">Join with a code</button>
        </div>
        <details class="how">
          <summary>How it works</summary>
          <p>Everyone in the room privately writes one word. When everyone's in, all the words are shown. If they don't all match, you go again, with every word written so far in front of you. No score, no timer, no race.</p>
          <p>A good opener: two people say random words, then everyone tries to find the word that sits between them.</p>
        </details>
      </div>
    `;
    document.getElementById("btnCreate").onclick = () => { connError = ""; pendingAction = "create"; view = "nickname"; render(); };
    document.getElementById("btnJoin").onclick = () => { connError = ""; pendingAction = "join"; view = "nickname"; render(); };
  }

  function renderNickname() {
    const isJoin = pendingAction === "join";
    root.innerHTML = `
      <div class="screen">
        <div class="back-row">
          <button class="back-btn" id="btnBack" aria-label="Back">←</button>
          <h2 class="screen-title" style="margin:0;">${isJoin ? "Join a room" : "Create a room"}</h2>
        </div>
        ${connError ? `<div class="banner error" role="alert" style="margin:0 0 18px;">${esc(connError)}</div>` : ""}
        <form id="nicknameForm" class="stack" style="flex:1;">
          <label class="field-label" for="nicknameInput" style="margin:0;">Your name</label>
          <input type="text" id="nicknameInput" maxlength="24" placeholder="What should we call you?" value="${esc(nickname)}" autocomplete="nickname" style="margin-bottom:6px;" />
          ${isJoin ? `
            <label class="field-label" for="codeInput" style="margin:0;">Room code</label>
            <input type="text" id="codeInput" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="6-digit code" value="${esc(joinCodeDraft)}" style="letter-spacing:0.1em;" />
          ` : ""}
          <div class="menu-actions">
            <button type="submit" class="btn btn-primary btn-block" id="btnGo">${isJoin ? "Join room" : "Create room"}</button>
          </div>
        </form>
      </div>
    `;
    document.getElementById("btnBack").onclick = () => { connError = ""; view = "menu"; render(); };
    const nameInput = document.getElementById("nicknameInput");
    nameInput.oninput = (e) => { nickname = e.target.value; };
    const codeInput = isJoin ? document.getElementById("codeInput") : null;
    if (codeInput) codeInput.oninput = (e) => {
      joinCodeDraft = e.target.value.replace(/\D/g, "").slice(0, 6);
      e.target.value = joinCodeDraft;
    };
    // Land the cursor on whatever still needs filling in.
    if (!document.activeElement || document.activeElement === document.body) {
      (isJoin && nickname && joinCodeDraft.length !== 6 ? codeInput : nameInput).focus();
    }

    document.getElementById("nicknameForm").onsubmit = (e) => {
      e.preventDefault();
      const name = nameInput.value.trim().slice(0, 24) || "Player";
      nickname = name;
      localStorage.setItem("matchit_nickname", name);
      if (isJoin) {
        const code = (codeInput.value || "").trim();
        if (code.length !== 6) { connError = "Enter the 6-digit room code."; render(); return; }
        onJoinRoom(code);
      } else {
        onCreateRoom();
      }
    };
  }

  function roomLink() {
    return location.origin + location.pathname + "?room=" + roomCode;
  }

  async function onShare() {
    const link = roomLink();
    if (navigator.share) {
      try { await navigator.share({ title: "Match It", text: `Join my Match It room: ${roomCode}`, url: link }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(link);
      showBanner("Invite link copied.", 2500, "info");
    } catch {
      prompt("Copy this invite link:", link);
    }
  }

  function renderLobby() {
    const selfRole = me() ? me().role : "player";
    const readyCount = room.players.filter((p) => p.role === "player" && p.connected).length;
    const canStart = isHost() && readyCount >= 2;
    const hasHistory = room.history.length > 0;

    root.innerHTML = `
      <div class="screen">
        <p class="section-label" style="text-align:center;">Room code</p>
        <div class="room-code" aria-label="Room code ${esc(roomCode.split("").join(" "))}">${esc(roomCode)}</div>
        <div class="share-row">
          <button class="btn btn-block" id="btnShare">Share invite link</button>
        </div>
        ${connError ? `<div class="banner ${bannerKind}" role="status" style="margin:0 0 18px;">${esc(connError)}</div>` : ""}
        ${!wsReady && !connError ? `<p class="hint-text" style="margin-bottom:18px;">Connecting…</p>` : ""}

        <p class="section-label">In the room (${room.players.length})</p>
        <ul class="player-list">
          ${room.players.map((p) => `
            <li class="player-row">
              <span class="dot-status ${p.connected ? "on" : ""}" title="${p.connected ? "Connected" : "Disconnected"}"></span>
              <span class="player-name">${esc(p.nickname)}${p.id === playerId ? " (you)" : ""}</span>
              ${p.id === room.hostId ? `<span class="player-tag host">Host</span>` : ""}
              ${p.role === "spectator" ? `<span class="player-tag">Watching</span>` : ""}
              ${isHost() && p.id !== playerId ? `<button class="kick-btn" data-kick="${esc(p.id)}" aria-label="Remove ${esc(p.nickname)}">✕</button>` : ""}
            </li>
          `).join("")}
        </ul>
        ${room.players.length < 2 ? `<p class="hint-text" style="text-align:left;">Nobody else yet. Share the code or link.</p>` : ""}

        <p class="section-label" style="margin-top:22px;">You're</p>
        <div class="role-toggle" role="group" aria-label="Your role">
          <button class="${selfRole === "player" ? "active" : ""}" id="rolePlayer" aria-pressed="${selfRole === "player"}">Playing</button>
          <button class="${selfRole === "spectator" ? "active" : ""}" id="roleSpectator" aria-pressed="${selfRole === "spectator"}">Watching</button>
        </div>

        ${hasHistory ? `
          <details class="how" style="margin:0 0 24px;">
            <summary>Last game (${room.history.length} round${room.history.length === 1 ? "" : "s"})</summary>
            <div class="recap">${boardHTML(room.history, boardColumns(room.history, false), "")}</div>
          </details>
        ` : ""}

        <div class="lobby-footer">
          ${isHost() ? `
            <button class="btn btn-primary btn-block" id="btnStart" ${canStart ? "" : "disabled"}>Start</button>
            ${!canStart ? `<p class="hint-text">Need at least 2 connected players.</p>` : ""}
          ` : `<p class="hint-text">Waiting for the host to start…</p>`}
          <button class="btn btn-ghost btn-block" id="btnLeave">Leave room</button>
        </div>
      </div>
    `;
    document.getElementById("rolePlayer").onclick = () => onSetRole("player");
    document.getElementById("roleSpectator").onclick = () => onSetRole("spectator");
    document.getElementById("btnLeave").onclick = onLeave;
    document.getElementById("btnShare").onclick = onShare;
    const recap = root.querySelector(".recap");
    if (recap) recap.closest("details").addEventListener("toggle", () => fitTiles(recap));
    root.querySelectorAll("[data-kick]").forEach((b) => { b.onclick = () => onKick(b.dataset.kick); });
    const startBtn = document.getElementById("btnStart");
    if (startBtn) startBtn.onclick = onStart;
  }

  // Long words step down a size instead of breaking mid-word. Measured, not
  // guessed from length: column width depends on the screen and the number
  // of players. One pass to read everything unwrapped, one to apply.
  function fitTiles(scope) {
    const board = scope && scope.querySelector(".board");
    if (!board || board.clientWidth === 0) return; // e.g. inside a closed <details>
    const tiles = [...board.querySelectorAll(".tile:not(.none):not(.away)")];
    board.classList.add("measuring");
    const ratios = tiles.map((t) => t.scrollWidth / Math.max(1, t.clientWidth));
    board.classList.remove("measuring");
    tiles.forEach((t, i) => {
      const r = ratios[i];
      t.classList.toggle("sm", r > 1 && r <= 1.16);
      t.classList.toggle("xs", r > 1.16);
    });
  }

  // Columns for the board: everyone playing now (join order), then anyone
  // who wrote a word earlier and has since left or started watching.
  function boardColumns(history, includeCurrent) {
    const cols = [];
    const seen = new Set();
    const add = (id, name, gone) => {
      if (!seen.has(id)) { seen.add(id); cols.push({ id, name, gone }); }
    };
    if (includeCurrent) {
      for (const p of room.players) if (p.role === "player") add(p.id, p.nickname, false);
    }
    for (const h of history) {
      for (const id of Object.keys(h.words)) {
        const live = room.players.find((p) => p.id === id);
        const name = (h.names && h.names[id]) || (live && live.nickname) || "Someone";
        add(id, name, includeCurrent && (!live || live.role !== "player"));
      }
    }
    return cols;
  }

  // The thread as a grid: read down a column to follow one person, across a
  // row to compare a round. Near-miss clusters share a hue and a count.
  function boardHTML(history, cols, currentRow) {
    const head = `
      <div class="board-row board-head" role="row">
        <span class="rn" aria-hidden="true"></span>
        ${cols.map((c) => `<span class="name ${c.id === playerId ? "me" : ""} ${c.gone ? "gone" : ""}" role="columnheader" title="${esc(c.name)}">${c.id === playerId ? "You" : esc(c.name)}</span>`).join("")}
      </div>`;
    const rows = history.map((h) => {
      const hue = {};
      let n = 0;
      if (!h.matched) {
        for (const g of h.groups || []) {
          if (g.length < 2) continue;
          n++;
          for (const id of g) hue[id] = { g: ((n - 1) % 3) + 1, size: g.length };
        }
      }
      const cells = cols.map((c, i) => {
        if (!(c.id in h.words)) {
          return `<span class="tile none" style="--i:${i}" role="cell" aria-label="${esc(c.name)}: no word">–</span>`;
        }
        const g = hue[c.id];
        const label = `${c.name}: ${h.words[c.id]}${g ? `, same as ${g.size - 1} other${g.size > 2 ? "s" : ""}` : ""}`;
        return `<span class="tile" style="--i:${i}" role="cell" ${g ? `data-g="${g.g}"` : ""} aria-label="${esc(label)}">${esc(h.words[c.id])}${g ? `<span class="count" aria-hidden="true">×${g.size}</span>` : ""}</span>`;
      }).join("");
      return `
        <div class="board-row ${h.matched ? "matched" : ""} ${h.round === freshRound ? "fresh" : ""}" role="row">
          <span class="rn">${h.round}</span>${cells}
        </div>`;
    }).join("");
    return `<div class="board" role="table" aria-label="Words by round" style="--cols:${cols.length}">${head}${rows}${currentRow || ""}</div>`;
  }

  function renderPlaying() {
    const locked = hasSubmittedThisRound();
    const spectating = me() && me().role === "spectator";
    const submitted = new Set(room.submittedIds || []);
    const cols = boardColumns(room.history, true);

    const currentRow = `
      <div class="board-row current" role="row" aria-label="Round ${room.round}, writing">
        <span class="rn">${room.round}</span>
        ${cols.map((c) => {
          const p = room.players.find((pp) => pp.id === c.id);
          if (c.gone || !p) return `<span class="tile status away" role="cell">–</span>`;
          if (!p.connected) return `<span class="tile status away" role="cell">away</span>`;
          const isIn = submitted.has(c.id) || (c.id === playerId && locked);
          if (c.id === playerId && isIn && sentWord.round === room.round) {
            return `<span class="tile status sent" role="cell" aria-label="You sent ${esc(sentWord.word)}">${esc(sentWord.word)}</span>`;
          }
          if (isIn) return `<span class="tile status in" role="cell" aria-label="${esc(c.name)} is in">✓ in</span>`;
          return `<span class="tile status" role="cell" aria-label="${esc(c.name)} is writing"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span>`;
        }).join("")}
      </div>`;

    const activeIds = room.players.filter((p) => p.role === "player" && p.connected).map((p) => p.id);
    const progress = activeIds.map((id) => `<i class="${submitted.has(id) ? "on" : ""}"></i>`).join("");
    const firstRound = room.history.length === 0;

    // Keep the reader's place: stay pinned to the newest round unless they
    // scrolled up to look at an earlier one.
    const prev = document.getElementById("thread");
    const stick = !prev || prev.scrollHeight - prev.scrollTop - prev.clientHeight < 48;
    const prevTop = prev ? prev.scrollTop : 0;
    const prevLeft = prev ? prev.scrollLeft : 0;

    root.innerHTML = `
      <div class="screen play-screen">
        <div class="play-header">
          <span class="round-pill">Round ${room.round}</span>
          <span class="round-pill" aria-label="${room.submittedCount} of ${room.activeCount} words in"><span class="progress" aria-hidden="true">${progress}</span>${room.submittedCount} of ${room.activeCount} in</span>
        </div>
        ${connError ? `<div class="banner error" role="alert" style="margin:0 0 14px;">${esc(connError)}</div>` : ""}
        ${revealNote ? `<div class="banner info reveal-note ${freshRound ? "fresh" : ""}" role="status" style="margin:0 0 14px;">${esc(revealNote)}</div>` : ""}
        ${room.activeCount < 2 ? `<div class="banner info" style="margin:0 0 14px;">Waiting for another player to reconnect…</div>` : ""}
        <div class="thread" id="thread">
          ${firstRound ? `<p class="thread-hint">Everyone writes any word. If they don't match, go again and aim for a word that connects them.</p>` : ""}
          ${boardHTML(room.history, cols, currentRow)}
        </div>
        <div class="compose">
          ${spectating ? `
            <div class="compose-locked">You're watching this game.</div>
          ` : locked ? `
            <div class="compose-locked">Word sent. Waiting on the rest of the room.</div>
          ` : `
            <form id="submitForm">
              <label class="visually-hidden" for="wordInput">Your word for round ${room.round}</label>
              <div class="compose-row">
                <input type="text" id="wordInput" maxlength="40" placeholder="${firstRound ? "Any word to start…" : "A word that connects them…"}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" value="${esc(wordDraft)}" />
                <button type="submit" class="btn btn-primary" ${wsReady ? "" : "disabled"}>Send</button>
              </div>
            </form>
          `}
          ${isHost() ? `<div class="end-game-row"><button id="btnEnd">End this game</button></div>` : ""}
        </div>
      </div>
    `;

    const thread = document.getElementById("thread");
    fitTiles(thread);
    thread.scrollTop = stick ? thread.scrollHeight : prevTop;
    thread.scrollLeft = prevLeft;
    const edge = () => thread.classList.toggle("more-right", thread.scrollWidth - thread.scrollLeft - thread.clientWidth > 4);
    edge();
    thread.addEventListener("scroll", edge, { passive: true });

    if (room.history.some((h) => h.round === freshRound)) freshRound = 0;

    const form = document.getElementById("submitForm");
    if (form) {
      const input = document.getElementById("wordInput");
      input.oninput = (e) => { wordDraft = e.target.value; };
      form.onsubmit = (e) => {
        e.preventDefault();
        onSubmit(input.value);
      };
      // New round, fresh compose bar: focus it on devices with a real keyboard
      // (on phones, popping the keyboard unasked hides the thread).
      if (autoFocusRound !== room.round && matchMedia("(pointer: fine)").matches) {
        autoFocusRound = room.round;
        input.focus();
      }
    }
    const endBtn = document.getElementById("btnEnd");
    if (endBtn) endBtn.onclick = () => { if (confirm("End this game for everyone?")) onEnd(); };
  }
  let autoFocusRound = 0;

  function renderMatched() {
    const entry = room.history[room.history.length - 1] || (lastReveal && lastReveal.matched ? lastReveal : null);
    const word = entry ? Object.values(entry.words)[0] : "";
    const rounds = entry ? entry.round : 0;
    const watching = me() && me().role === "spectator";
    const earlier = room.history.filter((h) => !h.matched);

    root.innerHTML = `
      <div class="matched-screen">
        <div class="pulse-ring" aria-hidden="true"></div>
        <p class="matched-label">${watching ? "They matched" : "You matched"}</p>
        <h1 class="matched-word">${esc(word)}</h1>
        <p class="matched-sub">${rounds <= 1 ? "First try. Spooky." : `Everyone landed on it in round ${rounds}.`}</p>
        ${earlier.length ? `
          <div class="path" id="path" aria-label="How you got there">
            ${boardHTML(room.history, boardColumns(room.history, false), "")}
          </div>
        ` : ""}
        <div class="matched-actions">
          ${isHost()
            ? `<button class="btn btn-primary btn-block" id="btnRematch">Play again</button>`
            : `<p class="hint-text">Waiting for the host to start a new game…</p>`}
          <button class="btn btn-ghost btn-block" id="btnLeave">Leave room</button>
        </div>
      </div>
    `;
    const path = document.getElementById("path");
    fitTiles(path);
    if (path) path.scrollTop = path.scrollHeight; // land on the winning row
    const rematchBtn = document.getElementById("btnRematch");
    if (rematchBtn) rematchBtn.onclick = onRematch;
    document.getElementById("btnLeave").onclick = onLeave;
  }

  // ---------------------------------------------------------------------
  // Theme toggle (persisted override on top of prefers-color-scheme)
  // ---------------------------------------------------------------------
  const themeBtn = document.getElementById("themeSwitch");
  const savedTheme = localStorage.getItem("matchit_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  themeBtn.onclick = () => {
    const current = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("matchit_theme", next);
  };

  // ---------------------------------------------------------------------
  // Boot — rejoin a room we were already in, if any
  // ---------------------------------------------------------------------
  // An invite link (?room=123456) wins over a remembered room: land on the
  // join form with the code filled in, so all that's left is a name.
  const linkedRoom = (params.get("room") || "").replace(/\D/g, "").slice(0, 6);
  const savedRoom = localStorage.getItem("matchit_room");
  if (linkedRoom.length === 6) {
    history.replaceState(null, "", location.pathname);
    if (linkedRoom === savedRoom && playerId) {
      view = "lobby";
      connect(savedRoom);
    } else {
      joinCodeDraft = linkedRoom;
      pendingAction = "join";
      view = "nickname";
    }
  } else if (savedRoom && playerId) {
    view = "lobby";
    connect(savedRoom);
  }
  render();

  // Coming back to a backgrounded tab: the socket may have been dropped while
  // timers were frozen. Say hello right away, or reconnect if it's dead.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !roomCode) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
    else if (!ws || ws.readyState > 1) connect(roomCode);
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
